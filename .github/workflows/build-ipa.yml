name: Build TrollGram IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      
      - name: Create fake codesigning directory
        run: |
          mkdir -p build-system/fake-codesigning
          touch build-system/fake-codesigning/.placeholder
      
      - name: Build IPA for device
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=1 \
            --configuration=release_arm64
      
      - name: Find IPA
        run: |
          find . -name "*.ipa" -exec cp {} TrollGram.ipa \;
          ls -la TrollGram.ipa || echo "IPA not found"
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollGram.ipa
          path: TrollGram.ipa
