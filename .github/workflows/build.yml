name: Build TrollGram IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      
      - name: Generate Xcode project
        run: python3 build-system/Make/Make.py --cacheDir="$HOME/telegram-bazel-cache" generateProject --configurationPath=build-system/template_minimal_development_configuration.json
      
      - name: Build and Archive
        run: |
          xcodebuild -workspace Telegram.xcworkspace \
                     -scheme Telegram \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath Telegram.xcarchive \
                     archive
      
      - name: Export IPA
        run: |
          mkdir -p ./build
          xcodebuild -exportArchive \
                     -archivePath Telegram.xcarchive \
                     -exportPath ./build \
                     -exportOptionsPlist ExportOptions.plist \
                     -allowProvisioningUpdates
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollGram.ipa
          path: ./build/*.ipa
